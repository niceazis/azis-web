name: PR validation

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Detect docs-only changes
        id: changes
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail

          if [ "$EVENT_NAME" != "pull_request" ]; then
            echo "full_test=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          full_test=false

          while IFS= read -r path; do
            [ -z "$path" ] && continue
            echo "changed: $path"

            case "$path" in
              *.md|docs/*|LICENSE)
                ;;
              *)
                full_test=true
                ;;
            esac
          done < <(git diff --name-only "$BASE_SHA" "$HEAD_SHA")

          echo "full_test=$full_test" >> "$GITHUB_OUTPUT"

      - name: Docs-only fast path
        if: steps.changes.outputs.full_test != 'true'
        run: echo "Docs-only change detected; skipping dependency installation and runtime tests."

      - uses: actions/setup-python@v5
        if: steps.changes.outputs.full_test == 'true'
        with:
          python-version: '3.x'

      - name: Run tests
        if: steps.changes.outputs.full_test == 'true'
        shell: bash
        run: |
          if [ -d tests ]; then
            python3 -m unittest discover -s tests -v
          else
            echo "No tests/ directory yet; nothing to run."
          fi
